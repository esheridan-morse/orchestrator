<div id="__orc_gate" style="position:fixed;inset:0;z-index:2147483647;background:#0f1115;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;">
  <div style="background:#1b1e26;padding:32px 28px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5);width:340px;text-align:center;">
    <div style="color:#fff;font-size:16px;font-weight:600;margin-bottom:4px;">Protected Preview</div>
    <div style="color:#9aa0ab;font-size:13px;margin-bottom:16px;">Orchestrator &mdash; preview only.</div>
    <input id="__orc_pw" type="password" placeholder="Access code" autofocus
      style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #333a47;border-radius:8px;background:#0f1115;color:#fff;font-size:14px;outline:none;margin-bottom:10px;"/>
    <button id="__orc_btn"
      style="width:100%;padding:10px 12px;border:0;border-radius:8px;background:#4f7cff;color:#fff;font-size:14px;font-weight:600;cursor:pointer;">Unlock</button>
    <div id="__orc_err" style="color:#ff6b6b;font-size:12px;height:16px;margin-top:8px;"></div>

<!-- ===== ORCHESTRATOR CONTENT (editable middle) ===== -->
<!-- The page lives in app.html and runs inside this iframe, so replacing it cannot touch the gate. -->
<!-- To ship a new version: overwrite app.html ONLY. Never edit the <script> blocks in this file. -->
<iframe
  title="Orchestrator"
  style="position:fixed;inset:0;width:100%;height:100%;border:0;margin:0;"
  src="app.html"></iframe>
<!-- ===== END CONTENT ===== -->
<script>
(function(){
  // Convenience gate on a static preview page. NOT a security control:
  // the code below is readable in page source, and app.html is directly
  // fetchable, so anyone who wants past this will get past it.
  //
  // NO AUTO-EXPIRY, deliberately. The sales-demo gate this is copied from
  // carries REMOVE_BY=2026-08-01 and silently began refusing everyone after
  // that date. A timer that locks out the audience without telling the owner
  // is worse than no timer. If this page needs a hard end date, delete the
  // repo or unpublish Pages — both are visible actions.
  var PW="IDP123";
  function unlock(){
    var v=document.getElementById('__orc_pw').value;
    if(v===PW){
      var g=document.getElementById('__orc_gate'); if(g) g.remove();
      document.documentElement.classList.remove('__orc_locked');
      document.body.classList.remove('__orc_locked');
    } else {
      document.getElementById('__orc_err').textContent='Incorrect code';
    }
  }
  function wire(){
    var b=document.getElementById('__orc_btn'),i=document.getElementById('__orc_pw');
    if(b) b.addEventListener('click',unlock);
    if(i) i.addEventListener('keydown',function(e){if(e.key==='Enter')unlock();});
  }
  if(document.readyState!=='loading') wire(); else document.addEventListener('DOMContentLoaded',wire);
})();
</script>
